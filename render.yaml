services:
  - type: web
    name: g6-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Optional: only needed if something calls the backend directly
      # (bypassing the frontend's /api proxy below), e.g. API testing tools.
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: g6-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Proxies /api/* to the backend server-side, so the browser sees a
      # same-origin request. Avoids CORS entirely and keeps working even
      # when the browser blocks cross-site requests (tracker blockers,
      # strict privacy modes). Replace the destination with your actual
      # g6-backend URL.
      - type: rewrite
        source: /api/*
        destination: https://group6-mxtw.onrender.com/:splat
      - type: rewrite
        source: /*
        destination: /index.html
